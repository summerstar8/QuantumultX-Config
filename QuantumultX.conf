# ============================================================
# Quantumult X 精简优化配置（无节点版）
# 银行精细分流 + 语法规范化 + 去除冗余
# 节点请在 App 内通过复制链接 / 扫码 / 订阅添加
# ============================================================

[general]
excluded_routes = 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8, 127.0.0.0/8
geo_location_checker = http://ip-api.com/json/?fields=8450015&lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
network_check_url = http://www.baidu.com
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 2000
udp_whitelist = 1-442, 444-65535
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com


[dns]
no-system
server = 223.5.5.5
server = 119.29.29.29
server = 8.8.8.8
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query


[policy]
# ========== 核心策略 ==========
url-latency-benchmark = ALL-benchmark, server-tag-regex=.*, check-interval=600, tolerance=50, alive-checking=true, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png

static = Group Select, ALL-benchmark, 香港节点, 美国节点, 日本节点, 新加坡节点, 台湾节点, 英国节点, 德国节点, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png

# ========== 地区测速 ==========
url-latency-benchmark = 香港节点, server-tag-regex=(?=.*(港|HK|Hong|專線|泰国|菲律宾)), check-interval=600, tolerance=50, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
url-latency-benchmark = 美国节点, server-tag-regex=(?=.*(美国|美國|US|States|American)), check-interval=600, tolerance=50, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
url-latency-benchmark = 日本节点, server-tag-regex=(?=.*(日本|JP|Japan)), check-interval=600, tolerance=50, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
url-latency-benchmark = 新加坡节点, server-tag-regex=(?=.*(新加坡|狮城|SG|Singapore)), check-interval=600, tolerance=50, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
url-latency-benchmark = 台湾节点, server-tag-regex=(?=.*(台|TW|Taiwan)), check-interval=600, tolerance=50, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png
url-latency-benchmark = 英国节点, server-tag-regex=(?=.*(英国|UK|Spain|Eugamehost)), check-interval=600, tolerance=50, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_Kingdom.png
url-latency-benchmark = 德国节点, server-tag-regex=(?=.*(德国|DE|Germany)), check-interval=600, tolerance=50, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Germany.png

# ========== 银行 / 金融精细分流 ==========
static = US BANK, 美国节点, Group Select, direct, img-url=banknote.fill.system
static = UK BANK, 英国节点, Group Select, direct, img-url=sterlingsign.circle.fill
static = HK BANK, 香港节点, Group Select, direct, img-url=building.2.fill
static = Germany BANK, 德国节点, Group Select, direct, img-url=eurosign.circle.fill
static = International BANK, UK BANK, US BANK, HK BANK, Germany BANK, Group Select, direct, img-url=globe.americas.fill
static = FINTECH / PAYMENT, US BANK, UK BANK, International BANK, HK BANK, Group Select, direct, img-url=creditcard.fill

# 加密货币
url-latency-benchmark = Crypto 自动选择, server-tag-regex=(?=.*(英国|UK|Spain|德国|DE|Germany|Eugamehost)), check-interval=300, tolerance=50, img-url=bitcoinsign.circle.fill
static = Cryptocurrency, Crypto 自动选择, UK BANK, Germany BANK, Group Select, direct, img-url=bitcoinsign.circle.fill

# ========== 功能策略 ==========
static = AGI, 美国节点, 日本节点, 英国节点, 德国节点, Group Select, img-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/chatgpt(balck).png
static = Telegram, Group Select, 香港节点, 新加坡节点, 美国节点, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram_X.png
static = YouTube, Group Select, 香港节点, 美国节点, 日本节点, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/YouTube.png
static = Netflix, Group Select, 香港节点, 美国节点, 新加坡节点, 日本节点, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png
static = Disney+, Group Select, 香港节点, 美国节点, 新加坡节点, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Disney+_2.png
static = Spotify, 美国节点, Group Select, 香港节点, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png
static = Global Media, Group Select, 香港节点, 美国节点, 日本节点, 新加坡节点, img-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/infuse.png
static = Apple service, direct, 美国节点, Group Select, img-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/Apple_SpringLoaded.png
static = Microsoft service, direct, Group Select, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png
